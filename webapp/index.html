<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Hot Dog Mafia</title>
  <link rel="stylesheet" href="/style.css" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div class="app">
    <header class="header">
      <img class="logo" src="/logo.svg" alt="Hot Dog Mafia" />
      <p class="brand">HOT DOG MAFIA</p>
      <h1 id="page-title">Hot Dog Mafia’ga xush kelibsiz!</h1>
      <p id="page-subtitle" class="subtitle">Mazali hot-doglar. Tez va qulay buyurtma.</p>
    </header>

    <main>
      <section id="view-home" class="view active">
        <div class="stack">
          <button class="action primary" data-nav="menu">
            <span><strong>Buyurtma berish</strong><small>Menyudan tanlab savatga qo‘shing</small></span>
            <span class="arrow">›</span>
          </button>
          <button class="action" data-nav="orders">
            <span><strong>Mening buyurtmalarim</strong><small>Buyurtmalar holatini ko‘ring</small></span>
            <span class="arrow">›</span>
          </button>
          <button class="action" data-nav="menu">
            <span><strong>Mafia menyusi</strong><small>Hot-doglar, qo‘shimcha va ichimliklar</small></span>
            <span class="arrow">›</span>
          </button>
        </div>
      </section>

      <section id="view-menu" class="view">
        <div class="toolbar">
          <button class="back" data-nav="home">← Orqaga</button>
          <h2>Mafia menyusi</h2>
        </div>
        <div id="menu-list" class="stack"></div>
        <div class="cart-bar" id="cart-bar">
          <div>
            <div class="cart-label">Savat</div>
            <div id="cart-summary" class="cart-summary">0 ta · 0 so‘m</div>
          </div>
          <button id="checkout-btn" class="btn">Rasmiylashtirish</button>
        </div>
      </section>

      <section id="view-checkout" class="view">
        <div class="toolbar">
          <button class="back" data-nav="menu">← Menyu</button>
          <h2>Buyurtmani rasmiylashtirish</h2>
        </div>
        <form id="checkout-form" class="form">
          <label>Ism <input name="full_name" type="text" required placeholder="Ismingiz" /></label>
          <label>Telefon <input name="phone" type="tel" required placeholder="+998 90 123 45 67" /></label>
          <label>Manzil <input name="address" type="text" required placeholder="Yetkazib berish manzili" /></label>
          <label>Izoh <textarea name="comment" rows="3" placeholder="Qo‘shimcha izoh (ixtiyoriy)"></textarea></label>
          <div id="checkout-items" class="order-items"></div>
          <div class="total-row"><span>Jami:</span><strong id="checkout-total">0 so‘m</strong></div>
          <button type="submit" class="btn full">Buyurtma berish</button>
        </form>
      </section>

      <section id="view-orders" class="view">
        <div class="toolbar">
          <button class="back" data-nav="home">← Orqaga</button>
          <h2>Mening buyurtmalarim</h2>
        </div>
        <div id="orders-list" class="stack"></div>
      </section>

      <section id="view-success" class="view">
        <div class="success-box">
          <h2>Buyurtmangiz qabul qilindi!</h2>
          <p id="success-text">Tez orada admin tomonidan tasdiqlanadi.</p>
          <button class="btn full" data-nav="orders">Mening buyurtmalarim</button>
          <button class="action" data-nav="home" style="margin-top:10px; justify-content:center;">Bosh sahifa</button>
        </div>
      </section>
    </main>
  </div>
  <div id="toast" class="toast"></div>
  <script src="/app.js"></script>
</body>
</html>
